name: fetch-thumb
on:
  push:
    paths: ['.github/workflows/fetch-thumb.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p incoming/ft
          for id in epdz8BeOR7I zGTqYHKPn3s; do
            curl -fsSL -o incoming/ft/$id.jpg https://i.ytimg.com/vi/$id/maxresdefault.jpg || curl -fsSL -o incoming/ft/$id.jpg https://i.ytimg.com/vi/$id/hqdefault.jpg || echo FAIL $id >> incoming/ft/_err.txt
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add incoming && git commit -m "一時：THE FIRST TAKEのサムネイル取得" && git push
