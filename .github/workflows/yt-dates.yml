name: yt-dates
on:
  push:
    paths: ['tools/yt_ids.txt','.github/workflows/yt-dates.yml']
permissions:
  contents: write
jobs:
  dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dates
        run: |
          mkdir -p incoming
          out=incoming/yt_dates.tsv; : > $out
          while read -r id; do
            [ -z "$id" ] && continue
            a=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -H "Accept-Language: en" -b "CONSENT=YES+cb; SOCS=CAESEwgDEgk0ODE3Nzk3MjQaAmVuIAEaBgiA_LyaBg" "https://www.youtube.com/watch?v=$id&hl=en" | grep -oE '"(publishDate|uploadDate)":"[^"]+"' | head -2 | tr '\n' ' ')
            b=$(curl -s -X POST "https://www.youtube.com/youtubei/v1/player?prettyPrint=false" -H "Content-Type: application/json" -d "{\"videoId\":\"$id\",\"context\":{\"client\":{\"clientName\":\"WEB\",\"clientVersion\":\"2.20240101.00.00\",\"hl\":\"en\"}}}" | grep -oE '"(publishDate|uploadDate)":"[^"]+"' | head -2 | tr '\n' ' ')
            c=$(curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UCx" >/dev/null; echo)
            printf "%s\t%s\t%s\n" "$id" "$a" "$b" >> $out
          done < tools/yt_ids.txt
          cat $out
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add incoming && git commit -m "yt-dates: MV公開日を取得（一時ファイル）" || exit 0
          git pull --rebase && git push
