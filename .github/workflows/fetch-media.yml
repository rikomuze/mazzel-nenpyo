name: fetch-media
on:
  push:
    paths: ['tools/*.txt','.github/workflows/fetch-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Jackets
        run: |
          mkdir -p incoming/jackets
          while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "incoming/jackets/$name.jpg" ] || curl -fsSL -A "Mozilla/5.0" -o "incoming/jackets/$name.jpg" "$url" || echo "FAIL $name" >> incoming/jackets/_errors.txt
          done < tools/jackets.txt
      - name: Extra files
        run: |
          mkdir -p incoming/extra
          if [ -f tools/fetch.txt ]; then
            while read -r name url; do
              [ -z "$name" ] && continue
              curl -fsSL -A "Mozilla/5.0" -o "incoming/extra/$name" "$url" || echo "FAIL $name $url" >> incoming/extra/_errors.txt
            done < tools/fetch.txt
          fi
      - name: YouTube dates and thumbnails
        run: |
          mkdir -p incoming/yt2
          : > incoming/yt2/dates.tsv
          while read -r id; do
            [ -z "$id" ] && continue
            html=$(curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -H "Accept-Language: ja" "https://www.youtube.com/watch?v=$id" || true)
            d=$(printf "%s" "$html" | grep -oE '"(uploadDate|publishDate)":"[^"]+"' | head -1)
            [ -z "$d" ] && d=$(printf "%s" "$html" | grep -oE 'itemprop="(datePublished|uploadDate)" content="[^"]+"' | head -1)
            printf "%s\t%s\n" "$id" "$d" >> incoming/yt2/dates.tsv
            [ -f "incoming/youtube/$id.jpg" ] || curl -fsSL -o "incoming/yt2/$id.jpg" "https://i.ytimg.com/vi/$id/maxresdefault.jpg" || curl -fsSL -o "incoming/yt2/$id.jpg" "https://i.ytimg.com/vi/$id/hqdefault.jpg" || true
          done < tools/yt_ids.txt
      - name: Pages
        run: |
          mkdir -p incoming/pages
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL -A "Mozilla/5.0" -o "incoming/pages/$name.html" "$url" || echo "FAIL $name" >> incoming/pages/_errors.txt
          done < tools/pages.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add incoming
          git commit -m "fetch-media: ジャケットとMVサムネイルを取得（一時ファイル）" || exit 0
          git pull --rebase
          git push
