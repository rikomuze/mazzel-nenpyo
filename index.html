<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAZZEL 年表</title>
<meta name="description" content="MAZZELの出演・ライブ・リリースなどを、通し番号つきでまとめた非公式ファン年表。">
<meta property="og:title" content="MAZZEL 年表">
<meta property="og:description" content="MAZZELの出演・ライブ・リリースなどを、通し番号つきでまとめた非公式ファン年表。">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,500&family=Zen+Old+Mincho:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Magazine index: masthead + contents, then one spread per month — rotated English month name, photo plate grid, numbered list. */
:root{
  --paper:#FFFFFF;--ink:#1A1A1A;--muted:#5F6168;--faint:#8D8F96;--rule:#1A1A1A;--hair:#E3E4E7;--plate:#ECEDEF;--blue:#2335A8;
  --f-didone:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.6}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.sc{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.no{font-family:var(--f-mono);font-size:12px;color:var(--blue);font-variant-numeric:tabular-nums}
.it{font-family:var(--f-didone);font-style:italic}

/* masthead */
.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 10px;border-bottom:1px solid var(--rule)}
.mast{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;align-items:end;padding-block:28px 26px;border-bottom:3px double var(--rule)}
.mast h1{margin:0;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.mh{font-family:var(--f-didone);font-weight:900;font-size:clamp(64px,11vw,118px);line-height:.9;letter-spacing:-.01em}
.mh-ja{font-family:var(--f-mincho);font-weight:700;font-size:28px}
.kicker{margin:12px 0 0;font-family:var(--f-didone);font-style:italic;font-size:16px}
.contents{display:flex;flex-direction:column;gap:6px}
.ix{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-family:var(--f-didone);font-size:17px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.ix .dots{border-bottom:1px dotted #A2A4AA;transform:translateY(-4px)}
.ix:hover .yr{text-decoration:underline;text-underline-offset:3px}

/* filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding-block:12px}
.types{display:flex;flex-wrap:wrap;gap:6px 18px}
.typ{background:none;border:0;padding:2px 0;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:1px solid transparent}
.typ[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.typ .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:4px}
.tools{margin-left:auto;display:flex;gap:16px;align-items:center}
.search{width:200px;max-width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:4px 0;font-size:14px;border-radius:0}
.search::placeholder{color:var(--faint)}
.order{background:none;border:0;padding:0;font-family:var(--f-didone);font-style:italic;font-size:15px;cursor:pointer;white-space:nowrap}

/* year + month */
.year{scroll-margin-top:var(--barh,64px)}
.yhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-block:52px 10px;border-bottom:1px solid var(--rule)}
.ynum{font-family:var(--f-didone);font-weight:400;font-size:clamp(48px,7vw,72px);line-height:1}
.mon{display:grid;grid-template-columns:110px minmax(0,1fr);gap:32px;padding-block:40px;border-bottom:1px solid var(--rule)}
.mlabel{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:flex-end;align-self:start;position:sticky;top:calc(var(--barh,64px) + 16px)}
.mname{font-family:var(--f-didone);font-style:italic;font-size:88px;line-height:1;letter-spacing:-.01em}
.myear{font-family:var(--f-mono);font-size:13px;color:var(--muted);writing-mode:horizontal-tb;transform:rotate(180deg)}
.mbody{display:flex;flex-direction:column;gap:32px;min-width:0}
/* justified rows: every photo keeps its own shape; each row shares one height and fills the width */
.plates{--h:230px;display:flex;flex-wrap:wrap;gap:28px 14px}
.plates.few{--h:330px}
.plates::after{content:"";flex-grow:1000000}
.plate{margin:0;min-width:0;flex-grow:var(--r);flex-basis:calc(var(--r) * var(--h))}
.plate .img{display:block;width:100%;padding:0;border:0;background:var(--plate);cursor:zoom-in;overflow:hidden}
.plate .img img{width:100%;height:auto;aspect-ratio:var(--r);object-fit:cover}
.plate.F{flex-basis:100%;flex-grow:0}
.plate.F .img,.plate.F figcaption{width:min(100%,calc(var(--r) * 460px))}
.plate figcaption{display:flex;flex-direction:column;gap:3px;padding-top:8px}
.pl{font-family:var(--f-mincho);font-weight:700;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.plate.F .pl{font-size:24px}
.plate .pl,.plate .pt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pt{font-family:var(--f-didone);font-style:italic;font-size:13px;color:#4A4C53;overflow-wrap:anywhere}
.more{margin:0 0 8px}
.list{list-style:none;margin:0;padding:0;columns:2 300px;column-gap:40px}
.list li{break-inside:avoid;display:grid;grid-template-columns:62px 64px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--hair);font-size:14px}
.ld{font-family:var(--f-didone);font-style:italic;font-size:14px;white-space:nowrap}
.lt{min-width:0;overflow-wrap:anywhere}
.lk{display:block;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:1px}
.lk .up{color:var(--blue)}
.lv{color:var(--muted);font-size:13px}
.src{font-size:11px;color:var(--faint);text-decoration:none;border-bottom:1px solid var(--hair);margin-left:6px;white-space:nowrap}
.src:hover{color:var(--blue);border-color:var(--blue)}
.multi{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.92);font-family:var(--f-mono);font-size:11px;padding:1px 6px}
.plate .img{position:relative}
.lb .nav{display:flex;gap:24px;align-items:center}
.lb .nav button{background:none;border:0;font-family:var(--f-didone);font-style:italic;font-size:16px;cursor:pointer;padding:8px}
.empty{padding-block:80px;text-align:center;color:var(--muted)}
.empty .it{font-size:22px;color:var(--ink);display:block;margin-bottom:8px}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:32px 64px;font-size:12px;color:var(--muted)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:30;background:rgba(255,255,255,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:zoom-out;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.lb img{max-height:calc(100% - 40px);max-width:100%;object-fit:contain}
.lb p{margin:0;font-family:var(--f-didone);font-style:italic;font-size:15px}

@media (max-width:760px){
  .mast{grid-template-columns:1fr;gap:24px}
  .mon{grid-template-columns:1fr;gap:16px;padding-block:28px}
  .mlabel{writing-mode:horizontal-tb;transform:none;flex-direction:row;align-items:baseline;justify-content:flex-start;position:static}
  .myear{transform:none}
  .mname{font-size:52px}
  .plates{--h:96px;gap:18px 8px}.plates.few{--h:150px}
  .plate.F .img,.plate.F figcaption{width:min(100%,calc(var(--r) * 300px))}
  .pl{font-size:14px}.plate.F .pl{font-size:18px}
  .tools{margin-left:0;width:100%}.search{flex:1;width:auto}
  .list li{grid-template-columns:52px 58px minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div id="app"><p class="empty wrap"><span class="it">Loading…</span>年表を読み込んでいます</p></div>
<div id="overlay"></div>
<script>
(function(){
var KINDS=["ライブ","出演","リリース","MV","配信","雑誌","SNS","その他"];
var KEN={"ライブ":"Live","出演":"TV","リリース":"Release","MV":"MV","配信":"Stream","雑誌":"Print","SNS":"SNS","その他":"Other"};
var NONE="未分類";
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW=["Sun.","Mon.","Tue.","Wed.","Thu.","Fri.","Sat."];
var st={q:"",kinds:[],order:"asc"};
var DATA={},all=[];
try{if(localStorage.getItem("mz-order")==="desc")st.order="desc";}catch(e){}
var app=document.getElementById("app");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n,w){n=String(n);while(n.length<(w||2))n="0"+n;return n;}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function dow(s){var p=s.split("-");return DOW[new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()];}
function kindsOf(e){return e.k&&e.k.length?e.k:[NONE];}
function split(t){var l=String(t).split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);return{head:l[0]||"",rest:l.slice(1).join(" / ")};}
function thumb(s){return /^images\/[^\/]+$/.test(s)?s.replace(/^images\//,"images/thumb/"):s;}
function srcHTML(e){return(e.src||[]).filter(function(x){return /^https?:\/\//.test(x.url);}).map(function(x){return'<a class="src" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.name||"出典")+' ↗</a>';}).join("");}
var BYID={},SIZES={};
function ratio(src){var s=SIZES[src];return s?Math.round(s[0]/s[1]*1000)/1000:1.5;}
window.fixRatio=function(img){var f=img.closest(".plate");if(!f||SIZES[img.dataset.full])return;var r=img.naturalWidth/img.naturalHeight;if(r)f.style.setProperty("--r",Math.round(r*1000)/1000);};
function match(e){
  if(st.kinds.length&&!kindsOf(e).some(function(k){return st.kinds.indexOf(k)>=0;}))return false;
  if(st.q){var q=st.q.toLowerCase();if((e.t+" "+e.d.replace(/-/g,".")).toLowerCase().indexOf(q)<0)return false;}
  return true;
}

function shell(){
  var years={};all.forEach(function(e){var y=e.d.slice(0,4);if(!years[y])years[y]=[e.no,e.no];years[y][1]=e.no;});
  var ys=Object.keys(years).sort();
  var first=all.length?all[0].d:"",last=all.length?all[all.length-1].d:"";
  var since=first?MONTHS[+first.slice(5,7)-1]+" "+first.slice(0,4):"";
  app.innerHTML=
  '<div class="wrap"><div class="topline"><span class="sc">An unofficial fan archive</span><span class="sc">Since '+esc(since)+' · '+all.length+' entries</span></div>'+
  '<header class="mast"><div><h1><span class="mh">MAZZEL</span><span class="mh-ja">年表</span></h1>'+
  '<p class="kicker">The complete chronicle, entry by entry — '+esc(first.slice(0,4))+' to the present.</p></div>'+
  '<nav class="contents" aria-label="年"><span class="sc" style="margin-bottom:4px">Contents</span>'+
  ys.map(function(y){return'<button type="button" class="ix" data-y="'+y+'"><span class="yr">'+y+'</span><span class="dots"></span><span class="no">'+pad(years[y][0],3)+'–'+pad(years[y][1],3)+'</span></button>';}).join("")+
  '</nav></header></div>'+
  '<div class="bar" id="bar"><div class="wrap"><div class="types" id="types" role="group" aria-label="種別"></div>'+
  '<div class="tools"><input id="q" class="search" type="search" placeholder="番組名・会場で検索" aria-label="検索"><button type="button" class="order" id="order"></button></div></div></div>'+
  '<main class="wrap" id="list"></main>'+
  '<footer class="wrap foot"><span>ファンが個人でまとめた非公式の年表です。内容の誤りや追加情報があればお知らせください。</span><span class="it" style="font-size:13px">Last updated '+esc((DATA.updated||"").replace(/-/g,"."))+'</span></footer>';
  document.querySelector(".contents").addEventListener("click",function(e){
    var b=e.target.closest("[data-y]");if(!b)return;
    if(st.kinds.length||st.q){st.kinds=[];st.q="";document.getElementById("q").value="";render();}
    var el=document.getElementById("y"+b.dataset.y);if(el)el.scrollIntoView();
  });
  document.getElementById("types").addEventListener("click",function(e){
    var b=e.target.closest(".typ");if(!b)return;var k=b.dataset.k;
    if(!k)st.kinds=[];else{var i=st.kinds.indexOf(k);if(i>=0)st.kinds.splice(i,1);else st.kinds.push(k);}
    render();
  });
  document.getElementById("q").addEventListener("input",function(e){st.q=e.target.value.trim();render();});
  document.getElementById("order").addEventListener("click",function(){st.order=st.order==="asc"?"desc":"asc";try{localStorage.setItem("mz-order",st.order);}catch(e){}render();});
  document.getElementById("list").addEventListener("click",function(e){
    var b=e.target.closest("[data-ev]");if(b&&BYID[b.dataset.ev])lightbox(BYID[b.dataset.ev],0);
  });
  measure();window.addEventListener("resize",measure);
}
function measure(){var b=document.getElementById("bar");if(b)document.documentElement.style.setProperty("--barh",(b.offsetHeight+8)+"px");}

function render(){
  var counts={};all.forEach(function(e){kindsOf(e).forEach(function(k){counts[k]=(counts[k]||0)+1;});});
  var ks=KINDS.filter(function(k){return counts[k];});if(counts[NONE])ks.push(NONE);
  document.getElementById("types").innerHTML='<button type="button" class="typ" data-k="" aria-pressed="'+(!st.kinds.length)+'">すべて</button>'+
    ks.map(function(k){return'<button type="button" class="typ" data-k="'+esc(k)+'" aria-pressed="'+(st.kinds.indexOf(k)>=0)+'">'+esc(k)+'<span class="n">'+counts[k]+'</span></button>';}).join("");
  document.getElementById("order").textContent=st.order==="asc"?"Oldest first":"Newest first";
  var vis=all.filter(match);if(st.order==="desc")vis.reverse();
  var list=document.getElementById("list");
  if(!vis.length){list.innerHTML='<p class="empty"><span class="it">Nothing found.</span>条件に合う出来事がありません。検索語や種別を変えてみてください。</p>';measure();return;}
  // group: year -> month
  var groups=[],gy=null,gm=null;
  vis.forEach(function(e){
    var y=e.d.slice(0,4),m=e.d.slice(5,7);
    if(!gy||gy.y!==y){gy={y:y,months:[]};groups.push(gy);gm=null;}
    if(!gm||gm.m!==m){gm={m:m,items:[]};gy.months.push(gm);}
    gm.items.push(e);
  });
  var t=today(),h="";
  groups.forEach(function(g){
    var n=0;g.months.forEach(function(m){n+=m.items.length;});
    h+='<section class="year" id="y'+g.y+'"><div class="yhead"><span class="ynum">'+g.y+'</span><span class="sc">'+n+' entries</span></div>';
    g.months.forEach(function(m){h+=monthHTML(g.y,m,t);});
    h+='</section>';
  });
  list.innerHTML=h;measure();
}
function monthHTML(y,m,t){
  var name=MONTHS[+m.m-1];
  var photos=m.items.filter(function(e){return e.img&&e.img.length;});
  var rest=m.items.filter(function(e){return !(e.img&&e.img.length);});
  var h='<div class="mon"><div class="mlabel"><span class="mname">'+name+'</span><span class="myear">'+y+'</span></div><div class="mbody">';
  if(photos.length){
    h+='<div class="plates'+(photos.length<=2?' few':'')+'">'+photos.map(function(e,i){
      var r=ratio(e.img[0]),size=e.feature?"F":"";
      var s=split(e.t),place=s.rest||s.head,title=s.rest?s.head:"";
      var day=+e.d.slice(8,10),cap=e.d.replace(/-/g,".")+" "+(s.rest||s.head);
      return'<figure class="plate '+size+'" style="--r:'+r+'"><button type="button" class="img" data-ev="'+esc(e.id)+'" aria-label="写真を拡大"><img loading="lazy" alt="'+esc(s.head)+'" src="'+esc(thumb(e.img[0]))+'" data-full="'+esc(e.img[0])+'" onerror="if(this.src.indexOf(\'/thumb/\')>-1)this.src=this.dataset.full" onload="fixRatio(this)">'+(e.img.length>1?'<span class="multi">1/'+e.img.length+'</span>':'')+'</button>'+
        '<figcaption><span class="no">No.'+pad(e.no,3)+' — '+dow(e.d)+' '+day+(e.d>t?' · Upcoming':'')+'</span><span class="pl">'+esc(place)+'</span>'+(title?'<span class="pt">'+esc(title)+'</span>':'')+(e.src&&e.src.length?'<span>'+srcHTML(e)+'</span>':'')+'</figcaption></figure>';
    }).join("")+'</div>';
  }
  if(rest.length){
    if(photos.length)h+='<h3 class="sc more">Also in '+name+'</h3>';
    h+='<ol class="list">'+rest.map(function(e){
      var s=split(e.t),day=+e.d.slice(8,10);
      var kl=kindsOf(e).map(function(k){return KEN[k]||"Other";}).join(" · ");
      return'<li><span class="no">No.'+pad(e.no,3)+'</span><span class="ld">'+dow(e.d)+' '+day+'</span><span class="lt"><span class="lk">'+esc(kl)+(e.d>t?' · <span class="up">Upcoming</span>':'')+'</span>'+esc(s.head)+(s.rest?' <span class="lv">'+esc(s.rest)+'</span>':'')+srcHTML(e)+'</span></li>';
    }).join("")+'</ol>';
  }
  return h+'</div></div>';
}
function lightbox(e,i){
  var o=document.getElementById("overlay"),n=e.img.length;
  var cap=e.d.replace(/-/g,".")+"　"+split(e.t).head+(split(e.t).rest?" — "+split(e.t).rest:"");
  o.innerHTML='<div class="lb" role="dialog" aria-label="写真" tabindex="-1"><img alt="" src="'+esc(e.img[i])+'"><p>'+esc(cap)+'</p>'+
    (n>1?'<div class="nav"><button type="button" data-step="-1" aria-label="前の写真">← Prev</button><span class="no">'+(i+1)+' / '+n+'</span><button type="button" data-step="1" aria-label="次の写真">Next →</button></div>':'')+'</div>';
  var lb=o.firstChild;lb.focus();
  function close(){o.innerHTML="";document.removeEventListener("keydown",k);}
  function go(d){document.removeEventListener("keydown",k);lightbox(e,(i+d+n)%n);}
  function k(ev){if(ev.key==="Escape")close();else if(n>1&&ev.key==="ArrowRight")go(1);else if(n>1&&ev.key==="ArrowLeft")go(-1);}
  lb.addEventListener("click",function(ev){var s=ev.target.closest("[data-step]");if(s){ev.stopPropagation();go(+s.dataset.step);}else close();});
  document.addEventListener("keydown",k);
}

Promise.all([
  fetch("data/events.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}),
  fetch("data/imgsize.json",{cache:"no-cache"}).then(function(r){return r.ok?r.json():{};}).catch(function(){return{};})
]).then(function(res){var d=res[0];SIZES=res[1]||{};
  DATA=d;
  all=(d.events||[]).filter(function(e){return e&&e.d&&e.t;}).map(function(e,i){e._i=i;return e;});
  all.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a._i-b._i;});
  all.forEach(function(e,i){e.no=i+1;BYID[e.id]=e;});
  shell();render();
}).catch(function(){
  app.innerHTML='<p class="empty wrap"><span class="it">Could not load.</span>年表データを読み込めませんでした。時間をおいて再読み込みしてください。</p>';
});
})();
</script>
</body>
</html>
